<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>LAPA Player TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18"></script>
  <style>
    :root {
      --bg: #05060a;
      --card: #121826;
      --line: rgba(255,255,255,.08);
      --text: #f6f7fb;
      --muted: #9aa3b5;
      --accent: #7b4dff;
      --accent2: #2f7bff;
      --live: #ff3355;
      --ok: #3ee0a0;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --header-h: 58px;
      --max: 1280px;
      --poster-w: 140px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    body { min-height: 100dvh; min-height: 100svh; }
    button, input { font: inherit; }
    img { max-width: 100%; height: auto; }
    .app {
      height: 100dvh; height: 100svh;
      display: grid; grid-template-rows: var(--header-h) 1fr;
      padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
    }
    .top {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      align-items: center; gap: 10px;
      padding: 0 12px; background: #0b0d14; border-bottom: 1px solid var(--line); z-index: 30;
      min-width: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .mark { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; background: #000; flex-shrink: 0; }
    .brand b { letter-spacing: .14em; font-size: 12px; }
    .brand small { display: block; color: #8fb4ff; letter-spacing: .2em; font-size: 8px; }
    nav { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; justify-content: center; }
    nav::-webkit-scrollbar { display: none; }
    .tab {
      border: 0; background: transparent; color: var(--muted); padding: 7px 12px;
      border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 12px; white-space: nowrap; flex-shrink: 0;
    }
    .tab.active { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .search {
      height: 34px; width: 180px; max-width: 28vw; border-radius: 999px; border: 1px solid var(--line);
      background: #0a0c13; color: var(--text); padding: 0 12px; min-width: 0;
    }
    .clock { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
    .add { border: 0; height: 34px; padding: 0 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 12px; background: #1a2030; color: var(--text); white-space: nowrap; }
    .page { min-height: 0; overflow: auto; overscroll-behavior: contain; }
    .shell { width: min(var(--max), 100%); margin: 0 auto; }

    .home-hero {
      min-height: clamp(200px, 38vh, 360px);
      display: flex; align-items: flex-end;
      padding: clamp(16px, 3vw, 36px);
      background:
        linear-gradient(90deg, rgba(5,6,10,.94) 8%, rgba(5,6,10,.42) 62%),
        radial-gradient(700px 380px at 75% 20%, rgba(90,80,255,.28), transparent 55%),
        #0a0c14;
    }
    .hero-copy { max-width: min(640px, 100%); }
    .kicker { color: #9bb7ff; letter-spacing: .18em; font-size: 11px; font-weight: 700; }
    .home-hero h1 {
      margin: 8px 0; font-size: clamp(22px, 4.2vw, 48px); line-height: 1.05;
      overflow-wrap: anywhere; word-break: break-word;
    }
    .home-hero p { color: var(--muted); margin: 0; max-width: 520px; }
    .hero-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 750; cursor: pointer; }
    .btn.gold { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .btn.ghost { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); }

    .rails { padding: 8px 0 calc(24px + var(--safe-b)); }
    .rail { margin: 14px 0; min-width: 0; }
    .rail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 clamp(12px, 2vw, 24px) 8px; }
    .rail-head h2 { margin: 0; font-size: clamp(15px, 2vw, 18px); }
    .rail-head span { color: var(--muted); font-size: 12px; flex-shrink: 0; }
    .scroller {
      display: flex; gap: 10px; overflow-x: auto; padding: 2px clamp(12px, 2vw, 24px) 10px;
      scrollbar-width: none; scroll-snap-type: x mandatory;
    }
    .scroller::-webkit-scrollbar { display: none; }
    .poster {
      flex: 0 0 var(--poster-w); width: var(--poster-w); aspect-ratio: 2/3; height: auto;
      border-radius: 12px; overflow: hidden; position: relative; background: var(--card);
      cursor: pointer; border: 1px solid var(--line); scroll-snap-align: start;
    }
    .poster.wide { flex-basis: 210px; width: 210px; aspect-ratio: 16/9; }
    .grid .poster { flex: initial; width: 100%; }
    .poster .art { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster .ph {
      width: 100%; height: 100%; display: grid; place-items: center; text-align: center; padding: 10px;
      background: linear-gradient(160deg, #1b2233, #0c1018 60%); font-weight: 750; font-size: 12px;
    }
    .poster figcaption {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,.92));
      font-size: 11px; font-weight: 650;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .badge { position: absolute; top: 7px; left: 7px; font-size: 9px; font-weight: 800; letter-spacing: .08em; padding: 3px 6px; border-radius: 6px; }
    .badge.live { background: var(--live); }
    .badge.vod { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .badge.ser { background: #4d7cff; }

    .layout-live {
      display: grid; grid-template-columns: minmax(160px, 200px) minmax(240px, 320px) minmax(0, 1fr);
      height: 100%; min-height: 0; width: 100%;
    }
    .cats, .chlist { overflow: auto; border-right: 1px solid var(--line); background: #090b12; min-width: 0; min-height: 0; }
    .cats { padding: 8px; }
    .cat { width: 100%; text-align: left; border: 0; background: 0; color: var(--text); padding: 9px 10px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
    .cat span, .cat { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat.active { background: linear-gradient(90deg, rgba(123,77,255,.2), transparent); box-shadow: inset 3px 0 0 var(--accent); color: #cbb6ff; }
    .cat small { color: var(--muted); flex-shrink: 0; }
    .ch { display: grid; grid-template-columns: 26px 42px minmax(0,1fr); gap: 8px; align-items: center; padding: 8px; cursor: pointer; min-width: 0; }
    .ch.active, .ch:hover { background: #151b28; }
    .ch strong, .ch span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .num { color: var(--muted); font-size: 11px; text-align: right; }
    .logo { width: 42px; height: 28px; object-fit: contain; background: #07090f; border-radius: 6px; }
    .logo.ph { display: grid; place-items: center; font-size: 10px; color: #667; }
    .stage { position: relative; min-width: 0; min-height: 0; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    .osd-name { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px);
      background: rgba(0,0,0,.55); padding: 7px 10px; border-radius: 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .grid-page { padding: 14px clamp(12px, 2vw, 24px) 32px; width: min(var(--max), 100%); margin: 0 auto; }
    .filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 14px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { border: 1px solid var(--line); background: #10141e; color: var(--muted); border-radius: 999px; padding: 6px 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-size: 12px; }
    .chip.on { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .empty-state { padding: 64px 20px; text-align: center; color: var(--muted); max-width: 480px; margin: 0 auto; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.66); display: none; place-items: center; z-index: 50; padding: 16px; }
    .modal.open { display: grid; }
    .sheet { width: min(560px, 100%); background: #121622; border: 1px solid var(--line); border-radius: 18px; padding: 18px; max-height: 90dvh; overflow: auto; }
    .sheet input { width: 100%; background: #0a0c13; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    #file { display: none; }
    .status.err { color: #ff8aa0; } .status.ok { color: var(--ok); }
    #vodPlayer { width: 100%; height: 100%; }
    .splash {
      position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(900px 500px at 50% 40%, #1a1240 0%, #05060a 62%);
      transition: opacity .7s ease, visibility .7s ease;
    }
    .splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-inner { text-align: center; animation: rise 1.1s ease both; width: min(360px, 92vw); }
    .splash-logo { width: min(280px, 70vw); max-height: 46vh; object-fit: contain; filter: drop-shadow(0 0 28px rgba(90,80,255,.45)); }
    .splash-bar { width: min(220px, 50vw); height: 3px; margin: 18px auto 0; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
    .splash-bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b14bff, #3d7bff); animation: load 2.2s ease forwards; }
    .splash-copy { margin-top: 14px; letter-spacing: .22em; font-size: 11px; color: #b9c4d8; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes load { to { width: 100%; } }

    /* phones */
    @media (max-width: 720px) {
      :root { --header-h: 96px; --poster-w: 112px; }
      .top { grid-template-columns: 1fr auto; grid-template-rows: 46px 42px; padding: 0 8px; }
      .brand small { display: none; }
      nav { grid-column: 1 / -1; justify-content: flex-start; }
      .search, .clock { display: none; }
      .layout-live { grid-template-columns: 1fr; grid-template-rows: minmax(180px, 38%) 44px minmax(0, 1fr); }
      .cats { display: flex; gap: 6px; overflow: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 8px; }
      .cat { width: auto; white-space: nowrap; flex-shrink: 0; }
      .poster.wide { flex-basis: 168px; width: 168px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    /* tablets */
    @media (min-width: 721px) and (max-width: 1100px) {
      :root { --poster-w: 128px; --max: 100%; }
      .search { width: 140px; }
      .layout-live { grid-template-columns: 180px minmax(0, 1fr); grid-template-rows: 1fr; }
      .layout-live .chlist { grid-column: 1; grid-row: 2; max-height: 42vh; }
      .layout-live { grid-template-columns: 200px 1fr; grid-template-rows: minmax(0,1fr) minmax(180px, 40%); }
      .cats { grid-column: 1; grid-row: 1 / span 2; }
      .stage { grid-column: 2; grid-row: 1; }
      .chlist { grid-column: 2; grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }
    /* TV / desktop largo */
    @media (min-width: 1400px) {
      :root { --max: 1440px; --poster-w: 156px; --header-h: 64px; }
      .top { padding: 0 24px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      :root { --header-h: 46px; }
      .home-hero { min-height: 160px; padding: 12px 16px; }
      .layout-live { grid-template-columns: 160px 220px 1fr; }
    }
  </style>
</head>
<body>
<div class="splash" id="splash">
  <div class="splash-inner">
    <img class="splash-logo" id="splashLogo" alt="LAPA Player TV">
    <div class="splash-bar"><span></span></div>
    <div class="splash-copy">SEU CONTEUDO. SEM LIMITES.</div>
  </div>
</div>
<div class="app">
  <header class="top">
    <div class="brand"><img class="mark" id="brandLogo" alt="LAPA"><div><b>LAPA</b><small>PLAYER TV</small></div></div>
    <nav>
      <button class="tab active" data-page="home">Inicio</button>
      <button class="tab" data-page="live">Ao vivo</button>
      <button class="tab" data-page="movies">Filmes</button>
      <button class="tab" data-page="series">Series</button>
    </nav>
    <div class="top-right">
      <input class="search" id="q" placeholder="Buscar" />
      <div class="clock" id="clock"></div>
      <button class="add" id="openList">+ Lista</button>
    </div>
  </header>
  <main class="page" id="page"></main>
</div>
<div class="modal" id="modal">
  <div class="sheet">
    <h2>Carregar lista M3U</h2>
    <p style="color:var(--muted)">O app separa sozinho ao vivo, filmes, series e destaques.</p>
    <input id="url" type="url" placeholder="https://provedor.com/playlist.m3u" />
    <div class="row">
      <button class="btn gold" id="loadUrl">Carregar URL</button>
      <label class="btn ghost" for="file">Enviar arquivo</label>
      <input id="file" type="file" accept=".m3u,.m3u8,.txt" />
      <button class="btn ghost" id="paste">Colar texto</button>
      <button class="btn ghost" id="closeModal">Fechar</button>
    </div>
    <p class="status" id="modalStatus"></p>
  </div>
</div>
<script>
const pageEl = document.getElementById("page");
let items = [];
let page = "home";
let liveGroup = "";
let vodGroup = "";
let serGroup = "";
let current = null;
let hls = null;
const RX_SERIES = /s[eé]rie|series|temporada|season|episode|epis[oó]dio|\bs\d{1,2}\s?e\d{1,2}\b|novela/;
const RX_MOVIE = /filme|filmes|movie|movies|vod|cinema|film\b|lancamento|lançamento/;
const RX_LIVE = /ao vivo|live tv|canais|channel|iptv|esporte|sport|noticia|news|aberto/;
const RX_FEAT = /destaque|featured|top\s?\d|popular|trending|imdb|oscar|4k|premium|lancamento|lançamento|novo/;
function classify(it) {
  const blob = (it.group + " " + it.name).toLowerCase();
  let type = "live";
  if (RX_SERIES.test(blob) && !/canal|live tv/.test(blob)) type = "series";
  else if (RX_MOVIE.test(blob)) type = "movie";
  else if (RX_LIVE.test(blob)) type = "live";
  else if (/s\d{2}|e\d{2}|temporada/.test(blob)) type = "series";
  return Object.assign({}, it, { type: type, featured: RX_FEAT.test(blob) });
}
function parseM3U(text) {
  const lines = text.replace(/\r/g, "").split("\n");
  const out = [];
  let info = null, n = 1;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line || line.indexOf("#EXTM3U") === 0 || line.indexOf("#EXTVLCOPT") === 0) continue;
    if (line.indexOf("#EXTINF:") === 0) {
      info = { name: "Titulo", group: "Geral", logo: "", url: "", num: n };
      const comma = line.indexOf(",");
      const attrs = comma >= 0 ? line.slice(8, comma) : line.slice(8);
      info.name = (comma >= 0 ? line.slice(comma + 1) : "Titulo").trim() || "Titulo";
      const g = attrs.match(/group-title="([^"]*)"/i);
      const l = attrs.match(/tvg-logo="([^"]*)"/i);
      if (g && g[1]) info.group = g[1];
      if (l) info.logo = l[1];
    } else if (line.charAt(0) !== "#" && info) {
      info.url = line;
      out.push(classify(info));
      info = null; n++;
    }
  }
  return out;
}
function byType(t) { return items.filter(function(i){ return i.type === t; }); }
function featured(t) {
  const pool = byType(t);
  const tagged = pool.filter(function(i){ return i.featured; });
  return (tagged.length >= 8 ? tagged : pool).slice(0, 18);
}
function groupsOf(t) {
  const m = new Map();
  byType(t).forEach(function(i){ m.set(i.group, (m.get(i.group) || 0) + 1); });
  return Array.from(m.entries()).sort(function(a,b){ return a[0].localeCompare(b[0], "pt"); });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]; });
}
function clock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
}

document.getElementById("splashLogo").src = LOGO_SRC;
document.getElementById("brandLogo").src = LOGO_SRC;
setTimeout(function(){ document.getElementById("splash").classList.add("hide"); }, 2600);
function posterHTML(it, wide) {
  const badge = it.type === "live" ? "live" : it.type === "series" ? "ser" : "vod";
  const label = it.type === "live" ? "AO VIVO" : it.type === "series" ? "SERIE" : "FILME";
  const art = it.logo
    ? "<img class=\"art\" src=\"" + esc(it.logo) + "\" alt=\"\" loading=\"lazy\" onerror=\"this.outerHTML='<div class=ph>" + esc(it.name) + "</div>'\">"
    : "<div class=\"ph\">" + esc(it.name) + "</div>";
  return "<figure class=\"poster" + (wide ? " wide" : "") + "\" data-url=\"" + esc(it.url) + "\">" +
    art + "<span class=\"badge " + badge + "\">" + label + "</span><figcaption>" + esc(it.name) + "</figcaption></figure>";
}
function setStatus(msg, type) {
  const el = document.getElementById("modalStatus");
  if (el) { el.textContent = msg; el.className = "status " + (type || ""); }
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const match = function(it){ return !q || it.name.toLowerCase().indexOf(q) >= 0 || it.group.toLowerCase().indexOf(q) >= 0; };
  if (!items.length) {
    pageEl.innerHTML = "<div class=\"empty-state\"><h2>Bem-vindo ao LAPA Player TV</h2><p>Carregue sua lista para ver destaques, filmes, series e canais ao vivo.</p></div>";
    return;
  }
  if (page === "home") renderHome(match);
  else if (page === "live") renderLive(match);
  else renderGrid(page === "movies" ? "movie" : "series", match);
}
function rail(title, arr, wide) {
  if (!arr.length) return "";
  return "<section class=\"rail\"><div class=\"rail-head\"><h2>" + title + "</h2><span>" + arr.length + " titulos</span></div><div class=\"scroller\">" +
    arr.map(function(i){ return posterHTML(i, wide && i.type === "live"); }).join("") + "</div></section>";
}
function renderHome(match) {
  const lives = byType("live").filter(match);
  const movies = byType("movie").filter(match);
  const series = byType("series").filter(match);
  const hero = featured("movie")[0] || featured("series")[0] || lives[0] || items[0];
  const featMovies = featured("movie").filter(match);
  const featSeries = featured("series").filter(match);
  pageEl.innerHTML =
    "<section class=\"home-hero\"><div><div class=\"kicker\">" +
    (hero.type === "live" ? "CANAL EM DESTAQUE" : hero.type === "series" ? "SERIE EM DESTAQUE" : "FILME EM DESTAQUE") +
    "</div><h1>" + esc(hero.name) + "</h1><p>" + esc(hero.group) + " · Catalogo separado em ao vivo, filmes e series.</p>" +
    "<div class=\"hero-actions\"><button class=\"btn gold\" data-play=\"" + esc(hero.url) + "\">Assistir agora</button>" +
    "<button class=\"btn ghost\" data-goto=\"" + (hero.type === "live" ? "live" : hero.type === "series" ? "series" : "movies") + "\">Ver categoria</button></div></div></section>" +
    "<div class=\"rails\">" +
      rail("Destaques de filmes", featMovies.length ? featMovies : movies.slice(0,18)) +
      rail("Destaques de series", featSeries.length ? featSeries : series.slice(0,18)) +
      rail("Canais ao vivo", lives.slice(0,24), true) +
      rail("Filmes", movies.slice(0,24)) +
      rail("Series", series.slice(0,24)) +
    "</div>";
}
function renderLive(match) {
  const lives = byType("live").filter(match);
  const groups = groupsOf("live");
  const list = liveGroup ? lives.filter(function(i){ return i.group === liveGroup; }) : lives;
  pageEl.innerHTML = "<div class=\"layout-live\"><aside class=\"cats\">" +
    "<button class=\"cat " + (!liveGroup ? "active" : "") + "\" data-lg=\"\">Todos <small>" + lives.length + "</small></button>" +
    groups.map(function(g){ return "<button class=\"cat " + (liveGroup===g[0]?"active":"") + "\" data-lg=\"" + esc(g[0]) + "\">" + esc(g[0]) + " <small>" + g[1] + "</small></button>"; }).join("") +
    "</aside><section class=\"chlist\">" +
    list.slice(0,800).map(function(i){
      return "<div class=\"ch " + (current && current.url===i.url ? "active" : "") + "\" data-url=\"" + esc(i.url) + "\">" +
        "<div class=\"num\">" + String(i.num).padStart(3,"0") + "</div>" +
        (i.logo ? "<img class=\"logo\" src=\"" + esc(i.logo) + "\">" : "<div class=\"logo ph\">TV</div>") +
        "<div><strong style=\"display:block;font-size:13px\">" + esc(i.name) + "</strong><span style=\"color:var(--muted);font-size:11px\">" + esc(i.group) + "</span></div></div>";
    }).join("") +
    "</section><section class=\"stage\"><video id=\"video\" controls playsinline></video><div class=\"osd-name\" id=\"osd\">" +
    (current ? esc(current.name) : "Selecione um canal") + "</div></section></div>";
  if (current && current.type === "live") attachCurrent();
}
function renderGrid(type, match) {
  const all = byType(type).filter(match);
  const groups = groupsOf(type);
  const g = type === "movie" ? vodGroup : serGroup;
  const list = g ? all.filter(function(i){ return i.group === g; }) : all;
  pageEl.innerHTML = "<div class=\"grid-page\"><div class=\"filters\">" +
    "<button class=\"chip " + (!g ? "on" : "") + "\" data-gg=\"\">Todos</button>" +
    groups.slice(0,40).map(function(x){ return "<button class=\"chip " + (g===x[0]?"on":"") + "\" data-gg=\"" + esc(x[0]) + "\">" + esc(x[0]) + " · " + x[1] + "</button>"; }).join("") +
    "</div><div class=\"grid\">" + list.slice(0,400).map(function(i){ return posterHTML(i); }).join("") + "</div></div>";
}
function destroyHls(){ if (hls) { try { hls.destroy(); } catch(e) {} hls = null; } }
function playItem(it) {
  current = it;
  if (it.type === "live") {
    page = "live";
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.page === "live"); });
    render();
  } else {
    openPlayerOverlay(it);
  }
}
function openPlayerOverlay(it) {
  let ov = document.getElementById("vodPlayer");
  if (!ov) {
    ov = document.createElement("div");
    ov.id = "vodPlayer";
    ov.style.cssText = "position:fixed;inset:0;background:#000;z-index:40;display:grid;grid-template-rows:48px 1fr";
    document.body.appendChild(ov);
  }
  ov.innerHTML = "<div style=\"display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08)\"><strong>" +
    esc(it.name) + "</strong><button class=\"btn ghost\" id=\"closeVod\">Fechar</button></div><video id=\"video\" controls autoplay playsinline style=\"width:100%;height:100%;background:#000\"></video>";
  ov.style.display = "grid";
  document.getElementById("closeVod").onclick = function(){ destroyHls(); ov.style.display = "none"; };
  attachCurrent();
}
function attachCurrent() {
  const video = document.getElementById("video");
  if (!video || !current) return;
  destroyHls();
  const src = current.url;
  const isHls = /\.m3u8(\?|$)/i.test(src) || src.indexOf("m3u8") >= 0;
  const osd = document.getElementById("osd");
  if (osd) osd.textContent = current.name;
  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, maxBufferLength: 30, xhrSetup: function(x){ x.withCredentials = false; } });
    hls.loadSource(src); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(function(){}); });
  } else {
    video.src = src; video.play().catch(function(){});
  }
}
document.querySelector("nav").addEventListener("click", function(e){
  const t = e.target.closest(".tab"); if (!t) return;
  page = t.dataset.page;
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("active", x === t); });
  render();
});
document.getElementById("q").addEventListener("input", render);
pageEl.addEventListener("click", function(e){
  const play = e.target.closest("[data-play]");
  if (play) { const it = items.find(function(i){ return i.url === play.dataset.play; }); if (it) playItem(it); return; }
  const go = e.target.closest("[data-goto]");
  if (go) {
    page = go.dataset.goto;
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("active", x.dataset.page === page); });
    render(); return;
  }
  const poster = e.target.closest("[data-url]");
  if (poster) { const it = items.find(function(i){ return i.url === poster.dataset.url; }); if (it) playItem(it); return; }
  const lg = e.target.closest("[data-lg]");
  if (lg) { liveGroup = lg.dataset.lg; render(); return; }
  const gg = e.target.closest("[data-gg]");
  if (gg) { if (page === "movies") vodGroup = gg.dataset.gg; else serGroup = gg.dataset.gg; render(); }
});
document.getElementById("openList").onclick = function(){ document.getElementById("modal").classList.add("open"); };
document.getElementById("closeModal").onclick = function(){ document.getElementById("modal").classList.remove("open"); };
document.getElementById("loadUrl").onclick = async function(){
  const url = document.getElementById("url").value.trim();
  if (!url) return setStatus("Informe a URL", "err");
  setStatus("Baixando lista...");
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    loadList(await res.text(), "URL");
  } catch(e) { setStatus("CORS bloqueou a URL. Envie o arquivo .m3u", "err"); }
};
document.getElementById("file").onchange = function(e){
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = function(){ loadList(String(r.result), f.name); }; r.readAsText(f);
};
document.getElementById("paste").onclick = function(){ const t = prompt("Cole o M3U"); if (t) loadList(t, "texto"); };
function loadList(text, label) {
  items = parseM3U(text);
  setStatus(items.length + " itens · " + byType("live").length + " ao vivo · " + byType("movie").length + " filmes · " + byType("series").length + " series", "ok");
  document.getElementById("modal").classList.remove("open");
  page = "home";
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("active", x.dataset.page === "home"); });
  render();
  try { localStorage.setItem("nexus_list", text.slice(0, 2500000)); } catch(e) {}
}
try {
  const s = localStorage.getItem("nexus_list");
  if (s) loadList(s, "ultima lista");
  else render();
} catch(e) { render(); }
</script>
